sudo docker network create \
  --driver bridge \
  --subnet 10.10.10.0/24 \
  --gateway 10.10.10.1 \
  -o com.docker.network.bridge.name=br-kali \
  -o com.docker.network.bridge.enable_ip_masquerade=false \
  reseau_kali

  sudo docker network create \
  --driver bridge \
  --subnet 10.20.20.0/24 \
  --gateway 10.20.20.1 \
  -o com.docker.network.bridge.name=br-ubuntu \
  -o com.docker.network.bridge.enable_ip_masquerade=false \
  reseau_ubuntu

  sudo docker run -dit \
  --name kali \
  --hostname kali \
  --network reseau_kali \
  --ip 10.10.10.10 \
  kalilinux/kali-rolling \
  sleep infinity

  sudo docker run -dit \
  --name ubuntu-cible \
  --hostname ubuntu-cible \
  --network reseau_ubuntu \
  --ip 10.20.20.10 \
  ubuntu:24.04 \
  sleep infinity

  
